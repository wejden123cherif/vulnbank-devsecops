
# ============================================================
# VulnBank DevSecOps - GitLab CI/CD Pipeline
#
# Security scanning
# Docker build and image publishing
# Kubernetes deployment
# Monitoring alert deployment
# OWASP ZAP DAST
# ============================================================

stages:
  - sast
  - secrets
  - filesystem
  - build
  - image-security
  - quality
  - security-tests
  - publish
  - deploy
  - monitoring
  - dast

variables:
  REPORT_DIR: "security-reports"
  IMAGE_NAME: "vuln-bank:ci"
  VULNBANK_URL: "http://127.0.0.1:5050"

# ============================================================
# 1. SAST - SEMGREP
# Report only
# ============================================================

semgrep-sast:
  stage: sast
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/src" \
        semgrep/semgrep:latest \
        semgrep scan \
        --config p/python \
        --json \
        --output "/src/$REPORT_DIR/semgrep.json" \
        /src || true

  artifacts:
    when: always
    paths:
      - security-reports/semgrep.json
    expire_in: 3 months

# ============================================================
# 2. SECRET DETECTION - GITLEAKS
# Report only
# ============================================================

gitleaks-secrets:
  stage: secrets
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/repo" \
        zricethezav/gitleaks:latest \
        detect \
        --source /repo \
        --report-format json \
        --report-path "/repo/$REPORT_DIR/gitleaks.json" \
        --verbose \
        --exit-code 0

  artifacts:
    when: always
    paths:
      - security-reports/gitleaks.json
    expire_in: 3 months

# ============================================================
# 3. FILESYSTEM VULNERABILITY SCAN - TRIVY
# Report only
#
# Persistent cache avoids unnecessary DB downloads.
# Scanner execution errors fail the job.
# Findings alone do not fail the job.
# ============================================================

trivy-filesystem:
  stage: filesystem
  tags:
    - devsecops

  resource_group: trivy-db-cache

  script:
    - mkdir -p "$REPORT_DIR"
    - |
      timeout 10m docker run --rm \
        -v "$CI_PROJECT_DIR:/src" \
        -v trivy-db-cache:/root/.cache/trivy \
        aquasec/trivy:latest \
        fs \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --timeout 9m \
        --exit-code 0 \
        --no-progress \
        --format json \
        --output "/src/$REPORT_DIR/trivy-fs.json" \
        /src

  artifacts:
    when: always
    paths:
      - security-reports/trivy-fs.json
    expire_in: 3 months

# ============================================================
# 4. DOCKER BUILD - BLOCKING
# ============================================================

docker-build:
  stage: build
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"
    - docker build -t "$IMAGE_NAME" .
    - docker image inspect "$IMAGE_NAME" > "$REPORT_DIR/image-info.json"

  artifacts:
    when: always
    paths:
      - security-reports/image-info.json
    expire_in: 3 months

# ============================================================
# 5. DOCKER IMAGE VULNERABILITY SCAN - TRIVY
#
# Persistent Docker volume stores the vulnerability DB.
# Uses Trivy's default registry configuration.
# Stops stalled scans after 10 minutes.
# Scanner errors are blocking; findings are report-only.
# ============================================================

trivy-image:
  stage: image-security
  tags:
    - devsecops

  resource_group: trivy-db-cache

  script:
    - mkdir -p "$REPORT_DIR"
    - |
      timeout 10m docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$CI_PROJECT_DIR:/src" \
        -v trivy-db-cache:/root/.cache/trivy \
        aquasec/trivy:latest \
        image \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --timeout 9m \
        --exit-code 0 \
        --no-progress \
        --format json \
        --output "/src/$REPORT_DIR/trivy-image.json" \
        "$IMAGE_NAME"

  artifacts:
    when: always
    paths:
      - security-reports/trivy-image.json
    expire_in: 3 months

# ============================================================
# 6. CODE QUALITY - SONARQUBE
# Report only
# ============================================================

sonarqube-analysis:
  stage: quality
  tags:
    - devsecops

  script:
    - |
      docker run --rm \
        -e SONAR_HOST_URL="$SONAR_HOST_URL" \
        -e SONAR_TOKEN="$SONAR_TOKEN" \
        -v "$CI_PROJECT_DIR:/usr/src" \
        sonarsource/sonar-scanner-cli:latest \
        -Dsonar.projectKey=devsecops \
        -Dsonar.qualitygate.wait=true || true

# ============================================================
# 7. SECURITY REGRESSION TESTS - BLOCKING
# ============================================================

security-regression:
  stage: security-tests
  tags:
    - devsecops

  script:
    - docker-compose up -d

    - |
      echo "Waiting for VulnBank..."

      for i in $(seq 1 30); do
        if curl -fs http://127.0.0.1:5050/healthz; then
          echo "VulnBank is ready."
          break
        fi

        echo "Attempt $i/30: VulnBank not ready yet..."
        sleep 2
      done

      if ! curl -fs http://127.0.0.1:5050/healthz; then
        echo "ERROR: VulnBank did not become ready."
        docker-compose ps
        docker-compose logs --tail=100
        exit 1
      fi

    - |
      docker run --rm \
        --network host \
        --user "$(id -u):$(id -g)" \
        -e VULNBANK_URL="$VULNBANK_URL" \
        -e SECURITY_TEST_PASSWORD="$SECURITY_TEST_PASSWORD" \
        -v "$CI_PROJECT_DIR:/workspace" \
        -w /workspace \
        python:3.11-slim \
        sh -c 'python -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet pytest requests && /tmp/venv/bin/pytest -q tests/security/'

  after_script:
    - docker-compose logs --tail=100 web || true
    - docker-compose down || true

# ============================================================
# 8. PUBLISH IMAGE TO GITLAB CONTAINER REGISTRY
# Main branch only
# ============================================================

publish-image:
  stage: publish
  tags:
    - devsecops

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  script:
    - |
      set -e

      DEPLOY_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

      echo "$CI_REGISTRY_PASSWORD" | \
        docker login "$CI_REGISTRY" \
        -u "$CI_REGISTRY_USER" \
        --password-stdin

      docker tag "$IMAGE_NAME" "$DEPLOY_IMAGE"
      docker push "$DEPLOY_IMAGE"

      echo "VulnBank image published successfully."

# ============================================================
# 9. AUTOMATED MINIKUBE DEPLOYMENT
# Main branch only
# ============================================================

deploy-minikube:
  stage: deploy
  tags:
    - devsecops

  resource_group: minikube

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  environment:
    name: minikube

  script:
    - |
      set -e

      echo "Deploying VulnBank to Minikube..."

      DEPLOY_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

      # Deploy PostgreSQL.
      kubectl -n vulnbank apply -f k8s/postgres.yaml

      kubectl -n vulnbank rollout status \
        statefulset/postgres --timeout=180s

      # Verify image placeholder.
      grep -q 'image: vuln-bank:k8s' k8s/web.yaml || {
        echo "ERROR: Image placeholder not found in web.yaml."
        exit 1
      }

      # Deploy Flask with the commit-specific image.
      sed "s|image: vuln-bank:k8s|image: ${DEPLOY_IMAGE}|" \
        k8s/web.yaml | kubectl -n vulnbank apply -f -

      # Verify Flask deployment.
      kubectl -n vulnbank rollout status \
        deployment/vulnbank-web --timeout=180s

      # Apply NetworkPolicy allow rules first.
      kubectl apply -n vulnbank \
        -f k8s/network-policies/allow-rules.yaml

      # Apply default-deny rules.
      kubectl apply -n vulnbank \
        -f k8s/network-policies/default-deny.yaml

      # Display deployed application resources.
      kubectl -n vulnbank get \
        pods,deployments,statefulsets,services

      echo "VulnBank deployment completed."

# ============================================================
# 10. MONITORING - DEPLOY PROMETHEUS ALERT RULES
#
# Prometheus, Grafana and Alertmanager are already
# installed with Helm by the Kubernetes administrator.
#
# GitLab Runner deploys only VulnBank alert rules.
# No cluster-admin permissions required.
# ============================================================

deploy-monitoring-alerts:
  stage: monitoring
  tags:
    - devsecops

  resource_group: minikube

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  script:
    - |
      set -e

      echo "Deploying VulnBank monitoring alerts..."

      # Validate alert configuration with Kubernetes.
      kubectl apply \
        --dry-run=server \
        -f monitoring/alerts.yaml

      # Create or update PrometheusRule.
      kubectl apply -f monitoring/alerts.yaml

      # Verify the rule exists.
      kubectl get prometheusrule \
        vulnbank-availability-alerts \
        -n monitoring

      # Display monitoring Pods.
      kubectl get pods -n monitoring

      echo "Monitoring alerts deployed successfully."

# ============================================================
# 11. MONITORING - VERIFY PROMETHEUS STACK
#
# Verifies Kubernetes workload readiness and rule presence.
# Does not perform an incident-response simulation.
# ============================================================

verify-monitoring:
  stage: monitoring
  tags:
    - devsecops

  resource_group: minikube

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  needs:
    - job: deploy-monitoring-alerts

  script:
    - |
      set -e

      echo "Verifying VulnBank monitoring..."

      # Grafana.
      kubectl rollout status \
        deployment/monitoring-grafana \
        -n monitoring --timeout=180s

      # Prometheus Operator.
      kubectl rollout status \
        deployment/monitoring-kube-prometheus-operator \
        -n monitoring --timeout=180s

      # kube-state-metrics.
      kubectl rollout status \
        deployment/monitoring-kube-state-metrics \
        -n monitoring --timeout=180s

      # Prometheus.
      kubectl rollout status \
        statefulset/prometheus-monitoring-kube-prometheus-prometheus \
        -n monitoring --timeout=180s

      # Alertmanager.
      kubectl rollout status \
        statefulset/alertmanager-monitoring-kube-prometheus-alertmanager \
        -n monitoring --timeout=180s

      # Custom VulnBank alerts.
      kubectl get prometheusrule \
        vulnbank-availability-alerts \
        -n monitoring

      echo "Monitoring verification completed."

# ============================================================
# 12. OWASP ZAP BASELINE DAST - BLOCKING
# Main branch only
# ============================================================

dast-baseline:
  stage: dast
  tags:
    - devsecops

  resource_group: minikube

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  script:
    - bash scripts/run-zap-baseline.sh

  allow_failure: false

  artifacts:
    when: always
    paths:
      - security-reports/zap/ci/
    expire_in: 7 days

# ============================================================
# 13. OWASP ZAP ACTIVE DAST
# Manual, isolated execution
# ============================================================

dast-active:
  stage: dast
  tags:
    - devsecops

  resource_group: dast-active-isolated

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

  script:
    - bash scripts/run-zap-active.sh

  artifacts:
    when: always
    paths:
      - security-reports/zap/active/
    expire_in: 7 days

  timeout: 40m

