stages:
  - sast
  - secrets
  - filesystem
  - build
  - image-security
  - quality

variables:
  REPORT_DIR: "security-reports"
  IMAGE_NAME: "vuln-bank:ci"


# ============================================================
# 1. SAST — Semgrep
# ============================================================

semgrep-sast:
  stage: sast
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"
    - docker run --rm
      -v "$CI_PROJECT_DIR:/src"
      semgrep/semgrep:latest
      semgrep scan
      --config p/python
      --json
      --output /src/$REPORT_DIR/semgrep.json
      /src

  artifacts:
    when: always
    paths:
      - security-reports/semgrep.json
    expire_in: 3 months


# ============================================================
# 2. Secret scanning — Gitleaks
# ============================================================

gitleaks-secrets:
  stage: secrets
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"
    - docker run --rm
      -v "$CI_PROJECT_DIR:/repo"
      zricethezav/gitleaks:latest
      detect
      --source /repo
      --report-format json
      --report-path /repo/$REPORT_DIR/gitleaks.json
      --verbose
      --exit-code 0

  artifacts:
    when: always
    paths:
      - security-reports/gitleaks.json
    expire_in: 3 months


# ============================================================
# 3. Dependency / filesystem scanning — Trivy
# ============================================================

trivy-filesystem:
  stage: filesystem
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"
    - docker run --rm
      -v "$CI_PROJECT_DIR:/src"
      aquasec/trivy:latest
      fs
      --scanners vuln
      --severity HIGH,CRITICAL
      --format json
      --output /src/$REPORT_DIR/trivy-fs.json
      /src

  artifacts:
    when: always
    paths:
      - security-reports/trivy-fs.json
    expire_in: 3 months


# ============================================================
# 4. Docker image build
# ============================================================

docker-build:
  stage: build
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"
    - docker build -t "$IMAGE_NAME" .
    - docker image inspect "$IMAGE_NAME" > "$REPORT_DIR/image-info.json"

  artifacts:
    when: always
    paths:
      - security-reports/image-info.json
    expire_in: 3 months


# ============================================================
# 5. Container image scanning — Trivy
# ============================================================

trivy-image:
  stage: image-security
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"
    - docker run --rm
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "$CI_PROJECT_DIR:/src"
      aquasec/trivy:latest
      image
      --severity HIGH,CRITICAL
      --format json
      --output /src/$REPORT_DIR/trivy-image.json
      "$IMAGE_NAME"

  artifacts:
    when: always
    paths:
      - security-reports/trivy-image.json
    expire_in: 3 months


# ============================================================
# 6. SonarQube — Code quality / Quality Gate
# ============================================================

sonarqube-analysis:
  stage: quality
  tags:
    - devsecops

  script:
    - docker run --rm
      -e SONAR_HOST_URL="$SONAR_HOST_URL"
      -e SONAR_TOKEN="$SONAR_TOKEN"
      -v "$CI_PROJECT_DIR:/usr/src"
      sonarsource/sonar-scanner-cli:latest
      -Dsonar.projectKey=devsecops
      -Dsonar.qualitygate.wait=true
