stages:
  - sast
  - secrets
  - filesystem
  - build
  - image-security
  - quality
  - security-tests

variables:
  REPORT_DIR: "security-reports"
  IMAGE_NAME: "vuln-bank:ci"
  VULNBANK_URL: "http://127.0.0.1:5050"

# ============================================================
# 1. SAST - REPORT ONLY
# ============================================================

semgrep-sast:
  stage: sast
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"

    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/src" \
        semgrep/semgrep:latest \
        semgrep scan \
        --config p/python \
        --json \
        --output "/src/$REPORT_DIR/semgrep.json" \
        /src || true

  artifacts:
    when: always
    paths:
      - security-reports/semgrep.json
    expire_in: 3 months


# ============================================================
# 2. GITLEAKS - REPORT ONLY
# ============================================================

gitleaks-secrets:
  stage: secrets
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"

    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/repo" \
        zricethezav/gitleaks:latest \
        detect \
        --source /repo \
        --report-format json \
        --report-path "/repo/$REPORT_DIR/gitleaks.json" \
        --verbose \
        --exit-code 0

  artifacts:
    when: always
    paths:
      - security-reports/gitleaks.json
    expire_in: 3 months


# ============================================================
# 3. TRIVY FILESYSTEM - REPORT ONLY
# ============================================================

trivy-filesystem:
  stage: filesystem
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"

    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/src" \
        aquasec/trivy:latest \
        fs \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --timeout 10m \
        --format json \
        --output "/src/$REPORT_DIR/trivy-fs.json" \
        /src || true

  artifacts:
    when: always
    paths:
      - security-reports/trivy-fs.json
    expire_in: 3 months


# ============================================================
# 4. DOCKER BUILD - BLOCKING
# ============================================================

docker-build:
  stage: build
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"

    - docker build -t "$IMAGE_NAME" .

    - docker image inspect "$IMAGE_NAME"  > "$REPORT_DIR/image-info.json"

  artifacts:
    when: always
    paths:
      - security-reports/image-info.json
    expire_in: 3 months


# ============================================================
# 5. TRIVY IMAGE - REPORT ONLY
# ============================================================

trivy-image:
  stage: image-security
  tags:
    - devsecops

  script:
    - mkdir -p "$REPORT_DIR"

    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$CI_PROJECT_DIR:/src" \
        aquasec/trivy:latest \
        image \
        --severity HIGH,CRITICAL \
        --format json \
        --output "/src/$REPORT_DIR/trivy-image.json" \
        "$IMAGE_NAME" || true

  artifacts:
    when: always
    paths:
      - security-reports/trivy-image.json
    expire_in: 3 months


# ============================================================
# 6. SONARQUBE - REPORT ONLY
# ============================================================

sonarqube-analysis:
  stage: quality
  tags:
    - devsecops

  script:
    - |
      docker run --rm \
        -e SONAR_HOST_URL="$SONAR_HOST_URL" \
        -e SONAR_TOKEN="$SONAR_TOKEN" \
        -v "$CI_PROJECT_DIR:/usr/src" \
        sonarsource/sonar-scanner-cli:latest \
        -Dsonar.projectKey=devsecops \
        -Dsonar.qualitygate.wait=true || true


# ============================================================
# 7. SECURITY REGRESSION TESTS - BLOCKING
# ============================================================

security-regression:
  stage: security-tests
  tags:
    - devsecops

  script:

    # Start the application
    - docker-compose up -d

    # Wait for the application
    - |
      echo "Waiting for VulnBank..."

      for i in $(seq 1 30); do
        if curl -fs http://127.0.0.1:5050/healthz; then
          echo "VulnBank is ready."
          break
        fi

        sleep 2
      done

    # Install test dependencies
    - docker run --rm --network host -e VULNBANK_URL="$VULNBANK_URL" -v "$CI_PROJECT_DIR:/workspace" -w /workspace python:3.11-slim sh -c "pip install --quiet pytest requests && pytest -q tests/security/"

    # Run known vulnerability regression tests
    - pytest -q tests/security/

  after_script:
    - docker-compose logs --tail=100 web || true
    - docker-compose down -v || true
