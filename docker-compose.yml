services:

  # ============================================================
  # Web application
  # ============================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "${VULNBANK_WEB_PORT:-5000}:5000"

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECURITY_TEST_PASSWORD: ${SECURITY_TEST_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./static/uploads:/app/static/uploads

    networks:
      - vuln_network

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    labels:
      autoheal: "true"


  # ============================================================
  # XSS cleanup worker
  # ============================================================
  xss-cleaner:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    command: ["python", "xss_cleanup.py"]

    environment:
      DB_NAME: ${DB_NAME:-vulnerable_bank}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      XSS_PAYLOAD_TTL_MINUTES: ${XSS_PAYLOAD_TTL_MINUTES:-15}
      XSS_CLEANUP_INTERVAL_SECONDS: ${XSS_CLEANUP_INTERVAL_SECONDS:-60}

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      disable: true

    networks:
      - vuln_network

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL


  # ============================================================
  # PostgreSQL database
  # ============================================================
  db:
    image: postgres:13

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-vulnerable_bank}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - vuln_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-vulnerable_bank}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true


  # ============================================================
  # Autoheal
  # ============================================================
  autoheal:
    image: willfarrell/autoheal:latest

    restart: unless-stopped

    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 30

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - vuln_network


volumes:
  postgres_data:


networks:
  vuln_network:
    driver: bridge
